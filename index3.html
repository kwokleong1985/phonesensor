<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emoji Space Pilot</title>
    <style>
        body { margin: 0; overflow: hidden; background: #050505; font-family: sans-serif; }
        canvas { display: block; }
        #ui {
            position: absolute; top: 20px; left: 20px; color: white;
            background: rgba(0,0,0,0.7); padding: 15px; border-radius: 10px;
            pointer-events: none; border: 1px solid #333;
        }
        .stat { margin: 5px 0; font-size: 18px; }
        #msg { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); 
               color: white; font-size: 40px; text-align: center; display: none; }
    </style>
</head>
<body>

<div id="ui">
    <div class="stat">🚀 Ship: <span id="hp">100</span>%</div>
    <div class="stat">⛽ Fuel: <span id="fuel">100</span>%</div>
    <div class="stat">🚩 Dist: <span id="dist">0</span>m</div>
    <div style="font-size: 12px; opacity: 0.7; margin-top: 10px;">ARROWS: Move | Reach the 🚩</div>
</div>

<div id="msg"></div>
<canvas id="gameCanvas"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const hpEl = document.getElementById('hp');
const fuelEl = document.getElementById('fuel');
const distEl = document.getElementById('dist');
const msgEl = document.getElementById('msg');

// Game State
let ship = {
    x: 100, y: 100,
    vx: 0, vy: 0,
    angle: -Math.PI / 2,
    hp: 100, fuel: 100,
    size: 30, thrusting: false
};

let destination = { x: 3000, y: -2000 };
let obstacles = [];
const worldSize = 5000;

// Initialize Obstacles (Asteroids)
for (let i = 0; i < 60; i++) {
    obstacles.push({
        x: Math.random() * worldSize - worldSize/2,
        y: Math.random() * worldSize - worldSize/2,
        type: Math.random() > 0.5 ? '🌑' : '🪐',
        size: 40
    });
}

const keys = {};
window.onkeydown = (e) => keys[e.code] = true;
window.onkeyup = (e) => keys[e.code] = false;

function update() {
    if (ship.hp <= 0 || ship.fuel <= 0) return;

    // Rotation
    if (keys['ArrowLeft']) ship.angle -= 0.07;
    if (keys['ArrowRight']) ship.angle += 0.07;

    // Acceleration (Up)
    ship.thrusting = false;
    if (keys['ArrowUp'] && ship.fuel > 0) {
        ship.vx += Math.cos(ship.angle) * 0.2;
        ship.vy += Math.sin(ship.angle) * 0.2;
        ship.fuel -= 0.1;
        ship.thrusting = true;
    }

    // Reverse Thrust (Down)
    if (keys['ArrowDown'] && ship.fuel > 0) {
        ship.vx -= Math.cos(ship.angle) * 0.1;
        ship.vy -= Math.sin(ship.angle) * 0.1;
        ship.fuel -= 0.05;
    }

    // Apply Physics
    ship.x += ship.vx;
    ship.y += ship.vy;
    ship.vx *= 0.99; // Slight space friction
    ship.vy *= 0.99;

    // Collision Detection
    obstacles.forEach(obs => {
        let dx = ship.x - obs.x;
        let dy = ship.y - obs.y;
        let distance = Math.sqrt(dx*dx + dy*dy);
        if (distance < obs.size) {
            // Bounce
            ship.vx *= -0.8;
            ship.vy *= -0.8;
            ship.hp -= 10;
            // Move ship slightly out of obstacle
            ship.x += dx * 0.1;
            ship.y += dy * 0.1;
        }
    });

    // Distance to goal
    let dx = destination.x - ship.x;
    let dy = destination.y - ship.y;
    let dist = Math.sqrt(dx*dx + dy*dy);
    distEl.innerText = Math.floor(dist);

    if (dist < 50) endGame("MISSION COMPLETE! 🚩");
    if (ship.hp <= 0) endGame("SHIP DESTROYED! 💥");
    if (ship.fuel <= 0 && Math.abs(ship.vx) < 0.1) endGame("OUT OF FUEL! ⛽");

    // UI update
    hpEl.innerText = Math.max(0, Math.floor(ship.hp));
    fuelEl.innerText = Math.max(0, Math.floor(ship.fuel));
}

function endGame(text) {
    msgEl.style.display = 'block';
    msgEl.innerText = text;
}

function draw() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    
    ctx.fillStyle = '#050505';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.save();
    // Camera follow
    ctx.translate(canvas.width/2 - ship.x, canvas.height/2 - ship.y);

    // Draw Destination
    ctx.font = '50px serif';
    ctx.fillText('🚩', destination.x, destination.y);

    // Draw Obstacles
    ctx.font = '40px serif';
    obstacles.forEach(obs => {
        ctx.fillText(obs.type, obs.x - 20, obs.y + 20);
    });

    // Draw Ship
    ctx.save();
    ctx.translate(ship.x, ship.y);
    ctx.rotate(ship.angle + Math.PI/2);
    ctx.font = '40px serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(ship.thrusting ? '🔥' : '🚀', 0, 0);
    ctx.restore();

    ctx.restore();

    update();
    requestAnimationFrame(draw);
}

draw();
</script>
</body>
</html>
