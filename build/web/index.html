<!DOCTYPE html>
<html>
<head>
  <!--

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/phonesensor/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="flutter_application_1">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>flutter_application_1</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div id="debug-box" style="position:fixed; top:0; left:0; background:black; color:lime; z-index:9999; font-family:monospace; padding:10px;">
    JS X: <span id="js-x">0</span>
  </div>

  <script src="flutter_bootstrap.js" async></script>
  
<script>
  window.askIOSPermission = function() {
    if (typeof DeviceOrientationEvent !== 'undefined' && 
        typeof DeviceOrientationEvent.requestPermission === 'function') {
      return DeviceOrientationEvent.requestPermission()
        .then(permissionState => {
          if (permissionState === 'granted') {
            // Listen to devicemotion (The most reliable for shaking)
            window.addEventListener('devicemotion', (event) => {
              // Try accelerationIncludingGravity, fallback to regular acceleration
              const acc = event.accelerationIncludingGravity || event.acceleration;
              const x = acc.x || 0;
              const y = acc.y || 0;
              
              // Update the "ugly green text" for debugging
              const debug = document.getElementById('js-x');
              if(debug) debug.innerText = x.toFixed(2);

              // Send to Flutter
              window.dispatchEvent(new CustomEvent('flutter-devicemotion', {
                detail: { x: x, y: y }
              }));
            }, true);
            return 'granted';
          }
          return permissionState;
        })
        .catch(err => {
          alert('Error: ' + err);
          return 'denied';
        });
    } else {
      // Non-iOS logic
      window.addEventListener('devicemotion', (event) => {
        const acc = event.accelerationIncludingGravity || event.acceleration;
        window.dispatchEvent(new CustomEvent('flutter-devicemotion', {
          detail: { x: acc.x || 0, y: acc.y || 0 }
        }));
      }, true);
      return Promise.resolve('granted');
    }
  };
</script>
</body>
</html>
