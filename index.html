<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Global Flight Tracker</title>
    <style>
        :root { --accent: #38bdf8; --bg: #0f172a; --card: #1e293b; }
        body { background: var(--bg); color: white; font-family: -apple-system, sans-serif; padding: 10px; margin: 0; }
        .panel { background: var(--card); padding: 12px; border-radius: 12px; margin-bottom: 10px; border: 1px solid #334155; }
        .label { font-size: 0.65rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; }
        input { background: #0f172a; color: white; border: 1px solid #475569; padding: 12px; width: 100%; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        
        /* Search list */
        .result-item { padding: 12px; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; }
        
        /* Tracker Grid */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .big-val { font-size: 2.2rem; font-weight: 800; color: var(--accent); display: block; }
        .med-val { font-size: 1.4rem; font-weight: bold; }
        .unit { font-size: 0.8rem; color: #94a3b8; margin-left: 3px; }
        
        #tracker { display: none; }
        button { background: var(--accent); color: #0f172a; border: none; padding: 15px; width: 100%; border-radius: 10px; font-weight: bold; }
        .emergency-btn { background: #475569; color: white; margin-top: 10px; }
    </style>
</head>
<body>

    <div id="setup-screen">
        <div class="panel">
            <span class="label">Search Airport</span>
            <input type="text" id="searchInput" placeholder="Search (e.g. SGN or Saigon)" oninput="doSearch()">
            <div id="results"></div>
        </div>
        <div id="selectedArea" style="display:none; padding:10px;">
            <div id="selectedName" style="color:var(--accent); font-weight:bold; margin-bottom:10px;"></div>
            <button id="activateBtn">START TRACKING</button>
        </div>
    </div>

    <div id="tracker">
        <div class="panel" style="text-align: center;">
            <span class="label">Distance to Destination</span>
            <span id="distNM" class="big-val">---<span class="unit">nm</span></span>
            <span id="distKM" style="color:#94a3b8">--- km</span>
            <hr style="border:0; border-top:1px solid #334155; margin:10px 0;">
            <span class="label">Estimated Time Remaining</span>
            <div id="etaVal" class="med-val">--h --m</div>
        </div>

        <div class="grid">
            <div class="panel">
                <span class="label">Bank Angle</span><br>
                <span id="bankVal" class="med-val">0°</span>
                <div id="bankDir" class="unit">Level</div>
            </div>
            <div class="panel">
                <span class="label">Inclination (Pitch)</span><br>
                <span id="pitchVal" class="med-val">0°</span>
                <div id="pitchDir" class="unit">Level</div>
            </div>
        </div>

        <div class="grid">
            <div class="panel">
                <span class="label">Ground Speed</span><br>
                <span id="spdKts" class="med-val">0</span><span class="unit">kts</span>
                <div id="spdKph" class="unit">0 km/h</div>
            </div>
            <div class="panel">
                <span class="label">Heading</span><br>
                <span id="hdgVal" class="med-val">0°</span>
                <div class="unit">Magnetic</div>
            </div>
        </div>

        <div class="panel">
            <span class="label">Altitude (GPS)</span><br>
            <span id="altVal" class="med-val">0</span><span class="unit">ft</span>
        </div>

        <button onclick="location.reload()" class="emergency-btn">RESET</button>
    </div>

    <script>
        const localAirports = [
            {code: "SIN", name: "Changi", city: "Singapore", lat: 1.3501, lon: 103.9940},
            {code: "LHR", name: "Heathrow", city: "London", lat: 51.4700, lon: -0.4543},
            {code: "JFK", name: "John F Kennedy", city: "New York", lat: 40.6413, lon: -73.7781},
            {code: "DXB", name: "Dubai Intl", city: "Dubai", lat: 25.2532, lon: 55.3657},
            {code: "HKG", name: "Hong Kong Intl", city: "Hong Kong", lat: 22.3089, lon: 113.9145},
            {code: "HND", name: "Haneda", city: "Tokyo", lat: 35.5494, lon: 139.7798},
            {code: "CDG", name: "Charles de Gaulle", city: "Paris", lat: 49.0097, lon: 2.5479},
            {code: "LAX", name: "Los Angeles Intl", city: "Los Angeles", lat: 33.9416, lon: -118.4085},
            {code: "SYD", name: "Kingsford Smith", city: "Sydney", lat: -33.9399, lon: 151.1753},
            {code: "FRA", name: "Frankfurt", city: "Frankfurt", lat: 50.0379, lon: 8.5622},
            {code: "SFO", name: "San Francisco Intl", city: "San Francisco", lat: 37.6213, lon: -122.3790},
            {code: "ICN", name: "Incheon Intl", city: "Seoul", lat: 37.4602, lon: 126.4407},
            {code: "AMS", name: "Schiphol", city: "Amsterdam", lat: 52.3105, lon: 4.7683},
            {code: "PEK", name: "Beijing Capital", city: "Beijing", lat: 40.0799, lon: 116.6031},
            {code: "MUC", name: "Munich", city: "Munich", lat: 48.3537, lon: 11.7861},
            {code: "YYZ", name: "Pearson Intl", city: "Toronto", lat: 43.6777, lon: -79.6248},
            {code: "BKK", name: "Suvarnabhumi", city: "Bangkok", lat: 13.6900, lon: 100.7501},
            {code: "TPE", name: "Taoyuan Intl", city: "Taipei", lat: 25.0797, lon: 121.2342},
            {code: "MEL", name: "Melbourne", city: "Melbourne", lat: -37.6690, lon: 144.8410},
            {code: "ZRH", name: "Zurich", city: "Zurich", lat: 47.4582, lon: 8.5555},
            {code: "SGN", name: "Tan Son Nhat Intl", city: "Ho Chi Minh City", lat: 10.8185, lon: 106.6518}
            {code: "SIN", name: "Changi", city: "Singapore", lat: 1.3501, lon: 103.9940},
            {code: "HAN", name: "Noi Bai", city: "Hanoi", lat: 21.2212, lon: 105.8072},
            {code: "DAD", name: "Da Nang Intl", city: "Da Nang", lat: 16.0439, lon: 108.1995}
            // Add more here...
        ];

        let targetLat, targetLon;

        function doSearch() {
            const term = document.getElementById('searchInput').value.toUpperCase();
            const resDiv = document.getElementById('results');
            resDiv.innerHTML = '';
            if (term.length < 2) return;
            
            localAirports.filter(a => a.code.includes(term) || a.city.toUpperCase().includes(term)).forEach(a => {
                const d = document.createElement('div');
                d.className = 'result-item';
                d.innerHTML = `<span><b>${a.code}</b> ${a.name}</span>`;
                d.onclick = () => {
                    targetLat = a.lat; targetLon = a.lon;
                    document.getElementById('selectedName').innerText = `Target: ${a.name} (${a.code})`;
                    document.getElementById('selectedArea').style.display = 'block';
                    resDiv.innerHTML = '';
                };
                resDiv.appendChild(d);
            });
        }

        document.getElementById('activateBtn').addEventListener('click', async () => {
            if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                await DeviceOrientationEvent.requestPermission();
            }
            document.getElementById('setup-screen').style.display = 'none';
            document.getElementById('tracker').style.display = 'block';
            startTracking();
        });

        function startTracking() {
            // Orientation (Bank/Pitch/Heading)
            window.addEventListener('deviceorientation', (e) => {
                const pitch = e.beta || 0;
                const bank = e.gamma || 0;
                const heading = e.webkitCompassHeading || e.alpha || 0;

                document.getElementById('pitchVal').innerText = Math.abs(pitch).toFixed(0) + "°";
                document.getElementById('pitchDir').innerText = pitch > 0 ? "Nose Up" : "Nose Down";
                
                document.getElementById('bankVal').innerText = Math.abs(bank).toFixed(0) + "°";
                document.getElementById('bankDir').innerText = bank > 5 ? "Right Bank" : (bank < -5 ? "Left Bank" : "Level");
                
                document.getElementById('hdgVal').innerText = Math.round(heading) + "°";
            });

            // GPS (Speed/Dist/ETA)
            navigator.geolocation.watchPosition((pos) => {
                const lat = pos.coords.latitude;
                const lon = pos.coords.longitude;
                const speedMps = pos.coords.speed || 0; // meters per second
                
                // Conversions
                const speedKts = speedMps * 1.94384;
                const speedKph = speedMps * 3.6;
                const altFt = (pos.coords.altitude || 0) * 3.28084;

                const distNM = calculateDistance(lat, lon, targetLat, targetLon);
                const distKM = distNM * 1.852;

                // ETA Calculation (Time = Dist / Speed)
                let etaStr = "--h --m";
                if (speedKts > 20) { // Only calculate if moving
                    const hoursRemaining = distNM / speedKts;
                    const h = Math.floor(hoursRemaining);
                    const m = Math.floor((hoursRemaining - h) * 60);
                    etaStr = `${h}h ${m}m`;
                }

                // Update UI
                document.getElementById('distNM').innerHTML = `${distNM.toFixed(1)}<span class="unit">nm</span>`;
                document.getElementById('distKM').innerText = `${distKM.toFixed(1)} km`;
                document.getElementById('etaVal').innerText = etaStr;
                document.getElementById('spdKts').innerText = Math.round(speedKts);
                document.getElementById('spdKph').innerText = Math.round(speedKph) + " km/h";
                document.getElementById('altVal').innerText = Math.round(altFt).toLocaleString();

            }, null, { enableHighAccuracy: true });
        }

        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 3440.06; // Nautical Miles
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }
    </script>
</body>
</html>
