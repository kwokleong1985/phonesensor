<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Avionics Raw Data</title>
    <style>
        body { background: #000; color: #0f0; font-family: monospace; padding: 10px; margin: 0; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
        .box { border: 1px solid #040; padding: 8px; }
        .label { color: #0a0; font-size: 0.8rem; display: block; }
        .val { font-size: 1.2rem; font-weight: bold; }
        .header { background: #020; padding: 5px; margin-top: 10px; color: #fff; font-size: 0.7rem; }
        button { background: #0f0; color: #000; width: 100%; padding: 15px; border: none; font-weight: bold; margin-bottom: 10px; }
    </style>
</head>
<body>

    <button id="startBtn">INITIALIZE AVIONICS</button>

    <div class="header">ATTITUDE (FUSED BY IOS)</div>
    <div class="grid">
        <div class="box"><span class="label">PITCH (B)</span><span id="pitch" class="val">0.0</span></div>
        <div class="box"><span class="label">BANK (G)</span><span id="bank" class="val">0.0</span></div>
        <div class="box"><span class="label">HDG (MAG)</span><span id="hdg" class="val">0.0</span></div>
    </div>

    <div class="header">ACCELEROMETER (G-FORCES)</div>
    <div class="grid">
        <div class="box"><span class="label">X (LAT)</span><span id="accX" class="val">0.0</span></div>
        <div class="box"><span class="label">Y (LONG)</span><span id="accY" class="val">0.0</span></div>
        <div class="box"><span class="label">Z (VERT)</span><span id="accZ" class="val">0.0</span></div>
    </div>

    <div class="header">GYROSCOPE (ROTATION RATE)</div>
    <div class="grid">
        <div class="box"><span class="label">ROLL RATE</span><span id="gyroG" class="val">0.0</span></div>
        <div class="box"><span class="label">PITCH RATE</span><span id="gyroB" class="val">0.0</span></div>
        <div class="box"><span class="label">YAW RATE</span><span id="gyroA" class="val">0.0</span></div>
    </div>

    <div class="header">GPS & TELEMETRY</div>
    <div class="grid">
        <div class="box"><span class="label">GND SPEED</span><span id="spd" class="val">0.0</span></div>
        <div class="box"><span class="label">ALT (GPS)</span><span id="alt" class="val">0.0</span></div>
        <div class="box"><span class="label">LAT</span><span id="lat" class="val">0.0</span></div>
        <div class="box"><span class="label">LON</span><span id="lon" class="val">0.0</span></div>
    </div>

    <script>
        const startBtn = document.getElementById('startBtn');

        startBtn.addEventListener('click', async () => {
            if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                const orient = await DeviceOrientationEvent.requestPermission();
                const motion = await DeviceMotionEvent.requestPermission();
                if (orient === 'granted' && motion === 'granted') {
                    startInstruments();
                    startGPS();
                }
            } else {
                startInstruments();
                startGPS();
            }
        });

        function startInstruments() {
            startBtn.style.display = 'none';

            // 1. DEVICE ORIENTATION (Attitude)
            window.addEventListener('deviceorientation', (e) => {
                document.getElementById('pitch').innerText = (e.beta || 0).toFixed(1);
                document.getElementById('bank').innerText = (e.gamma || 0).toFixed(1);
                document.getElementById('hdg').innerText = (e.webkitCompassHeading || 0).toFixed(0);
            });

            // 2. DEVICE MOTION (G-Forces and Gyro)
            window.addEventListener('devicemotion', (e) => {
                // Acceleration includes Gravity (9.8 m/s^2 at rest)
                const acc = e.accelerationIncludingGravity;
                document.getElementById('accX').innerText = (acc.x || 0).toFixed(2);
                document.getElementById('accY').innerText = (acc.y || 0).toFixed(2);
                document.getElementById('accZ').innerText = (acc.z || 0).toFixed(2);

                // Rotation Rate (deg/s)
                const rot = e.rotationRate;
                document.getElementById('gyroG').innerText = (rot.gamma || 0).toFixed(1);
                document.getElementById('gyroB').innerText = (rot.beta || 0).toFixed(1);
                document.getElementById('gyroA').innerText = (rot.alpha || 0).toFixed(1);
            });
        }

        function startGPS() {
            navigator.geolocation.watchPosition((pos) => {
                // speed is in m/s, convert to knots
                const knots = (pos.coords.speed || 0) * 1.94384;
                document.getElementById('spd').innerText = knots.toFixed(1) + " kt";
                document.getElementById('alt').innerText = (pos.coords.altitude || 0).toFixed(0) + " m";
                document.getElementById('lat').innerText = pos.coords.latitude.toFixed(4);
                document.getElementById('lon').innerText = pos.coords.longitude.toFixed(4);
            }, (err) => console.log(err), { enableHighAccuracy: true });
        }
    </script>
</body>
</html>
