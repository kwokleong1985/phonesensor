<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Global Flight Navigator</title>
    <style>
        :root { --p-blue: #38bdf8; --p-bg: #0f172a; --p-card: #1e293b; }
        body { background: var(--p-bg); color: white; font-family: -apple-system, sans-serif; padding: 15px; margin: 0; }
        .panel { background: var(--p-card); padding: 15px; border-radius: 12px; margin-bottom: 15px; border: 1px solid #334155; }
        .label { font-size: 0.7rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; }
        input, select { background: #0f172a; color: white; border: 1px solid #475569; padding: 10px; width: 100%; border-radius: 6px; box-sizing: border-box; margin: 5px 0 10px 0; }
        button { background: var(--p-blue); color: #0f172a; border: none; padding: 15px; width: 100%; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        #tracker { display: none; text-align: center; }
        .big-val { font-size: 2.5rem; font-weight: 800; color: var(--p-blue); display: block; }
    </style>
</head>
<body>

    <div id="setup-screen">
        <h2>Flight Setup</h2>
        
        <div class="panel">
            <span class="label">Option 1: Quick Select (Offline Ready)</span>
            <select id="quickSelect" onchange="applyQuickSelect()">
                <option value="">-- Choose Hub --</option>
                <option value="1.3501,103.9940,SIN">Singapore Changi (SIN)</option>
                <option value="22.3089,113.9145,HKG">Hong Kong (HKG)</option>
                <option value="25.2532,55.3657,DXB">Dubai (DXB)</option>
                <option value="51.4700,-0.4543,LHR">London Heathrow (LHR)</option>
                <option value="40.6413,-73.7781,JFK">New York JFK (JFK)</option>
                <option value="35.7767,140.3864,NRT">Tokyo Narita (NRT)</option>
            </select>
        </div>

        <div class="panel">
            <span class="label">Option 2: Global Search (Needs Internet)</span>
            <div style="display:flex; gap:5px;">
                <input type="text" id="searchInput" placeholder="Search Airport Code (e.g. LAX)">
                <button onclick="searchAirport()" style="width:80px; margin-top:5px; padding:10px;">Find</button>
            </div>
        </div>

        <div class="panel">
            <span class="label">Option 3: Manual Coordinates</span>
            <input type="text" id="destName" placeholder="Airport Name">
            <div class="grid">
                <input type="number" id="destLat" step="any" placeholder="Latitude">
                <input type="number" id="destLon" step="any" placeholder="Longitude">
            </div>
            <button id="activateBtn" style="background:#22c55e">START TRACKING</button>
        </div>
    </div>

    <div id="tracker">
        <div class="panel">
            <span class="label">Distance to <span id="targetDisplay">Destination</span></span>
            <span id="distVal" class="big-val">---</span>
            <span class="label">Nautical Miles</span>
        </div>
        <div class="grid">
            <div class="panel"><span class="label">GND Speed</span><span id="spdVal" style="font-size:1.5rem; font-weight:bold;">0</span><span class="label"> kts</span></div>
            <div class="panel"><span class="label">Heading</span><span id="hdgVal" style="font-size:1.5rem; font-weight:bold;">0°</span><span class="label"> Magnetic</span></div>
        </div>
        <div class="panel">
            <span class="label">Altitude</span>
            <span id="altVal" style="font-size:1.5rem; font-weight:bold;">0</span><span class="label"> feet MSL</span>
        </div>
        <button onclick="location.reload()" style="background:#475569; color:white">Change Flight</button>
    </div>

    <script>
        // REDUNDANCY 1: Apply from Select
        function applyQuickSelect() {
            const val = document.getElementById('quickSelect').value;
            if (!val) return;
            const [lat, lon, name] = val.split(',');
            document.getElementById('destLat').value = lat;
            document.getElementById('destLon').value = lon;
            document.getElementById('destName').value = name;
        }

        // REDUNDANCY 2: Search API
        async function searchAirport() {
            const query = document.getElementById('searchInput').value;
            if (!query) return;
            try {
                const res = await fetch(`https://autocomplete.travelpayouts.com/places2?term=${query}&locale=en&types[]=airport`);
                const data = await res.json();
                if (data.length > 0) {
                    document.getElementById('destLat').value = data[0].coordinates.lat;
                    document.getElementById('destLon').value = data[0].coordinates.lon;
                    document.getElementById('destName').value = data[0].name;
                } else { alert("Not found."); }
            } catch (e) { alert("Search requires internet connection."); }
        }

        // NAVIGATION LOGIC
        document.getElementById('activateBtn').addEventListener('click', async () => {
            const lat = parseFloat(document.getElementById('destLat').value);
            const lon = parseFloat(document.getElementById('destLon').value);
            if (isNaN(lat) || isNaN(lon)) { alert("Need coordinates!"); return; }

            // Request Permissions
            if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                await DeviceOrientationEvent.requestPermission();
            }

            document.getElementById('setup-screen').style.display = 'none';
            document.getElementById('tracker').style.display = 'block';
            document.getElementById('targetDisplay').innerText = document.getElementById('destName').value || "Dest";

            startNavigation(lat, lon);
        });

        function startNavigation(dLat, dLon) {
            // Compass
            window.addEventListener('deviceorientation', (e) => {
                document.getElementById('hdgVal').innerText = Math.round(e.webkitCompassHeading || e.alpha || 0) + "°";
            });

            // GPS
            navigator.geolocation.watchPosition((pos) => {
                const p = pos.coords;
                const dist = calculateHaversine(p.latitude, p.longitude, dLat, dLon);
                
                document.getElementById('distVal').innerText = dist.toFixed(1);
                document.getElementById('spdVal').innerText = Math.round((p.speed || 0) * 1.94384);
                document.getElementById('altVal').innerText = Math.round((p.altitude || 0) * 3.28084).toLocaleString();
            }, null, { enableHighAccuracy: true });
        }

        function calculateHaversine(lat1, lon1, lat2, lon2) {
            const R = 3440.06; // Nautical Miles
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }
    </script>
</body>
</html>
